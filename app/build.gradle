plugins {
    id 'com.android.application'
}

android {
    namespace 'app.sharpremote'
    compileSdk 35

    defaultConfig {
        applicationId 'app.sharpremote'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
